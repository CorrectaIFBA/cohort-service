# Local development overrides. Activate with SPRING_PROFILES_ACTIVE=local.

spring.datasource.url=${ENV_DATASOURCE_POSTGRES_URL:jdbc:postgresql://localhost:5432/cohort_service}
spring.datasource.username=${ENV_DATASOURCE_POSTGRES_USERNAME:correcta}
spring.datasource.password=${ENV_DATASOURCE_POSTGRES_PASSWORD:local-correcta}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

clients.identity-service.url=${ENV_IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
clients.identity-service.internal-token=${ENV_IDENTITY_SERVICE_INTERNAL_TOKEN:local-internal-token}

spring.rabbitmq.addresses=${ENV_RABBITMQ_URL:amqp://correcta:local-correcta@localhost:5672}
mailer.app-url=${ENV_APP_URL:http://localhost:5173}
