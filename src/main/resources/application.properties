spring.application.name=cohort-service

# === PostgreSQL ===
spring.datasource.url=${ENV_DATASOURCE_POSTGRES_URL}
spring.datasource.username=${ENV_DATASOURCE_POSTGRES_USERNAME}
spring.datasource.password=${ENV_DATASOURCE_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA ===
spring.jpa.hibernate.ddl-auto=${ENV_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# === SpringDoc OpenAPI ===
springdoc.api-docs.enabled=${ENV_SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${ENV_SPRINGDOC_ENABLED:false}

# === Actuator ===
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# === Identity-service (Feign) ===
clients.identity-service.url=${ENV_IDENTITY_SERVICE_URL}
clients.identity-service.internal-token=${ENV_IDENTITY_SERVICE_INTERNAL_TOKEN}
spring.cloud.openfeign.client.config.identity-service.connect-timeout=${ENV_IDENTITY_SERVICE_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.identity-service.read-timeout=${ENV_IDENTITY_SERVICE_READ_TIMEOUT_MS:5000}

# === Transactional mail (RabbitMQ) ===
spring.rabbitmq.addresses=${ENV_RABBITMQ_URL}
mailer.rabbitmq.exchange=${ENV_MAILER_RABBITMQ_EXCHANGE:send-transactional-mail-exchange}
mailer.rabbitmq.routing-key=${ENV_MAILER_RABBITMQ_ROUTING_KEY:send-transactional-mail-routing-key}
mailer.app-url=${ENV_APP_URL:https://correcta.staily.dev}
