spring.datasource.url=jdbc:h2:mem:cohortdb;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# The migrations are PostgreSQL SQL; tests on H2 build the schema from the entities instead.
spring.flyway.enabled=false
clients.identity-service.url=http://127.0.0.1:0
clients.identity-service.internal-token=test-internal-token
spring.rabbitmq.addresses=amqp://guest:guest@localhost:5672
mailer.app-url=http://localhost:5173
